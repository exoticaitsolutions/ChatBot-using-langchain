<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload PDF</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden; 
        }

        #background-container {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        #background-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #content-container {
            position: relative;
            z-index: 1;
            max-width: 400px;
            margin: 20px;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #007bff;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #495057;
        }

        input[type="file"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ced4da;
            border-radius: 5px;
        }

        button {
            background-color: #007bff;
            color: #ffffff;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
<body>
    <div id="background-container">
        <img id="background-image" src="https://kinsta.com/wp-content/uploads/2019/10/how-to-upload-html-file-to-wordpress.jpg" alt="Background Image">
    </div>

    <div id="content-container">
        <h1>Upload PDF</h1>

        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <label for="id_pdf_file">Choose a PDF file:</label>
            {{ form.pdf_file }}
            <button type="submit">Upload</button>
        </form>
    </div>
</body>
</html>
